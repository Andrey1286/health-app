<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Диалог с врачом — оценка рисков</title>
<style>
  :root {
    --bg: linear-gradient(135deg, #e0eafc, #cfdef3);
    --card: #fff;
    --text: #2d3748;
    --text-soft: #4a5568;
    --muted: #718096;
    --border: #cbd5e0;
    --header: #2c5282;
    --header-text: #fff;
    --bubble: #f7fafc;
    --btn: #2c5282;
    --btn-hover: #2a4365;
    --btn-sec: #edf2f7;
    --btn-sec-text: #2d3748;
    --risk-low: #c6f6d5;
    --risk-low-t: #22543d;
    --risk-med: #feebc8;
    --risk-med-t: #7b341e;
    --risk-high: #fed7d7;
    --risk-high-t: #742a2a;
    --missing: #fff5b1;
    --missing-b: #f6e05e;
    --credentials-bg: #f7fafc;
    --input-bg: #fff;
    --accent: #38a169;
    --taplink: #6b46c1;
    --taplink-hover: #553c9a;
    --hint-bg: #ebf8ff;
    --hint-border: #90cdf4;
    --hint-text: #2c5282;
    --pregnant-bg: #fef5e7;
    --pregnant-border: #f39c12;
    --pregnant-text: #7d6608;
  }
  body.dark {
    --bg: linear-gradient(135deg, #1a202c, #2d3748);
    --card: #2d3748;
    --text: #e2e8f0;
    --text-soft: #cbd5e0;
    --muted: #a0aec0;
    --border: #4a5568;
    --header: #1a365d;
    --header-text: #fff;
    --bubble: #1a202c;
    --btn: #4299e1;
    --btn-hover: #3182ce;
    --btn-sec: #4a5568;
    --btn-sec-text: #e2e8f0;
    --risk-low: #22543d;
    --risk-low-t: #c6f6d5;
    --risk-med: #7b341e;
    --risk-med-t: #feebc8;
    --risk-high: #742a2a;
    --risk-high-t: #fed7d7;
    --missing: #744210;
    --missing-b: #d69e2e;
    --credentials-bg: #1a202c;
    --input-bg: #1a202c;
    --accent: #48bb78;
    --taplink: #9f7aea;
    --taplink-hover: #805ad5;
    --hint-bg: #1a365d;
    --hint-border: #2b6cb0;
    --hint-text: #90cdf4;
    --pregnant-bg: #744210;
    --pregnant-border: #d69e2e;
    --pregnant-text: #fbd38d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    transition: background 0.3s, color 0.3s;
  }
  .app {
    width: 100%;
    max-width: 760px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    overflow: hidden;
    transition: background 0.3s;
  }
  .header {
    background: var(--header);
    color: var(--header-text);
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .header-controls { display: flex; gap: 8px; }
  .reset-btn, .theme-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .reset-btn:hover, .theme-btn:hover { background: rgba(255,255,255,0.3); }
  .content { padding: 24px; min-height: 400px; }

  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stagger > * { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
  .stagger > *:nth-child(1) { animation-delay: 0.05s; }
  .stagger > *:nth-child(2) { animation-delay: 0.15s; }
  .stagger > *:nth-child(3) { animation-delay: 0.25s; }
  .stagger > *:nth-child(4) { animation-delay: 0.35s; }
  .stagger > *:nth-child(5) { animation-delay: 0.45s; }
  .stagger > *:nth-child(6) { animation-delay: 0.55s; }
  .stagger > *:nth-child(7) { animation-delay: 0.65s; }
  .stagger > *:nth-child(8) { animation-delay: 0.75s; }

  .progress {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #38a169;
    transition: width 0.4s;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: var(--text);
  }
  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--input-bg);
    color: var(--text);
  }
  .field input::placeholder { color: var(--muted); }
  .field .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    font-style: italic;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 140px; }
  .btn {
    background: var(--btn);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s, transform 0.1s;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { background: var(--btn-sec); color: var(--btn-sec-text); }
  .btn.secondary:hover { background: var(--border); }
  .btn.small { padding: 8px 16px; font-size: 13px; }
  .btn.accent { background: var(--accent); }
  .btn.accent:hover { background: #2f855a; }
  .btn.taplink { background: var(--taplink); font-weight: 600; }
  .btn.taplink:hover { background: var(--taplink-hover); }
  .btn.warning { background: #dd6b20; }
  .btn.warning:hover { background: #c05621; }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  .intro { text-align: center; padding: 20px 0; }
  .intro-avatar { width: 150px; height: 200px; margin: 0 auto 20px; }
  .intro-avatar svg { width: 100%; height: 100%; }
  .intro h2 { color: var(--btn); margin-bottom: 10px; }
  .intro p { color: var(--text-soft); line-height: 1.6; margin-bottom: 15px; }
  .intro .credentials {
    background: var(--credentials-bg);
    border-left: 4px solid var(--btn);
    padding: 15px;
    margin: 20px 0;
    text-align: left;
    border-radius: 0 8px 8px 0;
  }
  .intro .credentials h3 { margin-top: 0; color: var(--btn); font-size: 16px; }
  .intro .credentials ul { margin: 10px 0; padding-left: 20px; }
  .intro .credentials li { margin: 8px 0; color: var(--text-soft); }

  .dialog { display: flex; gap: 16px; flex-wrap: wrap; }
  .avatar { flex-shrink: 0; width: 120px; height: 160px; }
  .avatar svg { width: 100%; height: 100%; }
  .mouth {
    transform-origin: center;
    animation: talk 0.3s infinite alternate;
    animation-play-state: paused;
  }
  .mouth.active { animation-play-state: running; }
  @keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(0.4); } }
  .arm { transform-origin: 60px 90px; animation: gesture 2s infinite ease-in-out; }
  @keyframes gesture { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
  .bubble {
    flex: 1;
    background: var(--bubble);
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    min-width: 280px;
    transition: background 0.3s;
  }
  .options { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .option {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    transition: all 0.2s;
    color: var(--text);
  }
  .option:hover { border-color: var(--btn); background: var(--bubble); transform: translateX(4px); }
  .option.taplink-opt {
    border-color: var(--taplink);
    background: var(--taplink);
    color: #fff;
    font-weight: 600;
  }
  .option.taplink-opt:hover { background: var(--taplink-hover); }
  .risk { display: inline-block; padding: 3px 10px; border-radius: 4px; font-weight: 600; font-size: 13px; }
  .risk.low { background: var(--risk-low); color: var(--risk-low-t); }
  .risk.med { background: var(--risk-med); color: var(--risk-med-t); }
  .risk.high { background: var(--risk-high); color: var(--risk-high-t); }
  .risk.warn { background: #bee3f8; color: #2a4365; }
  .risk.pregnant { background: var(--pregnant-bg); color: var(--pregnant-text); border: 1px solid var(--pregnant-border); }
  .missing-data {
    background: var(--missing);
    border: 1px solid var(--missing-b);
    padding: 10px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text);
  }
  .info-hint {
    background: var(--hint-bg);
    border-left: 3px solid var(--hint-border);
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    margin: 12px 0;
    font-size: 13px;
    color: var(--hint-text);
    line-height: 1.5;
  }
  .good-news {
    background: var(--risk-low);
    border-left: 4px solid var(--risk-low-t);
    padding: 12px;
    border-radius: 0 8px 8px 0;
    margin: 12px 0;
    font-size: 14px;
    color: var(--risk-low-t);
    line-height: 1.5;
  }
  .pregnant-warning {
    background: var(--pregnant-bg);
    border-left: 4px solid var(--pregnant-border);
    padding: 12px;
    border-radius: 0 8px 8px 0;
    margin: 12px 0;
    font-size: 14px;
    color: var(--pregnant-text);
    line-height: 1.5;
  }

  .risk-scale {
    margin: 10px 0 14px 0;
    padding: 10px 12px;
    background: var(--bubble);
    border-radius: 8px;
  }
  .risk-scale-bar {
    position: relative;
    height: 20px;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    margin-bottom: 6px;
  }
  .risk-scale-bar .seg { flex: 1; }
  .risk-scale-bar .seg.low { background: #48bb78; }
  .risk-scale-bar .seg.med { background: #ed8936; }
  .risk-scale-bar .seg.high { background: #f56565; }
  .risk-scale-bar .seg.vhigh { background: #c53030; }
  .risk-scale-marker {
    position: absolute;
    top: -4px;
    width: 4px;
    height: 28px;
    background: #1a202c;
    border-radius: 2px;
    transition: left 0.5s;
    box-shadow: 0 0 0 2px #fff;
  }
  .risk-scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .report-section {
    background: var(--bubble);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .report-section h3 {
    margin-top: 0;
    color: var(--btn);
    font-size: 16px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 8px;
  }
  .report-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .report-item:last-child { border-bottom: none; }
  .report-item .val-block { text-align: right; }
  .report-item .ref-line {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 400;
  }
  .bio-age-display {
    text-align: center;
    padding: 24px;
    background: linear-gradient(135deg, var(--btn), #2b6cb0);
    color: #fff;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .bio-age-number {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
  }
  .bio-age-label { font-size: 14px; opacity: 0.9; margin-top: 4px; }
  .bio-age-diff {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    background: rgba(255,255,255,0.2);
  }

  .checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--bubble);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .checklist-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
  }
  .checklist-item.done { opacity: 0.6; }
  .checklist-item.done .test-name { text-decoration: line-through; }
  .test-name { flex: 1; font-weight: 500; }
  .test-reason { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .test-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--risk-med);
    color: var(--risk-med-t);
    white-space: nowrap;
  }
  .test-status.done {
    background: var(--risk-low);
    color: var(--risk-low-t);
  }

  .whatif-slider { margin-bottom: 16px; }
  .whatif-slider label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .whatif-slider input[type="range"] {
    width: 100%;
    accent-color: var(--btn);
  }
  .whatif-slider .value {
    font-weight: 600;
    color: var(--btn);
  }
  .whatif-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--bubble);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .whatif-toggle input { width: 20px; height: 20px; }

  .modified-banner {
    background: var(--risk-med);
    border-left: 4px solid var(--risk-med-t);
    padding: 12px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--risk-med-t);
    line-height: 1.5;
  }

  .calc-block {
    background: var(--hint-bg);
    border: 1px solid var(--hint-border);
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--hint-text);
  }
  .calc-block strong { color: var(--btn); }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .app { border-radius: 12px; }
    .header { padding: 12px 16px; font-size: 16px; }
    .content { padding: 16px; }
    .field input, .field select { font-size: 16px; padding: 12px; }
    .field label { font-size: 15px; }
    .field .hint { font-size: 13px; }
    .btn { font-size: 16px; padding: 14px 20px; width: 100%; text-align: center; }
    .btn.small { font-size: 14px; padding: 10px 16px; }
    .actions { flex-direction: column; }
    .intro-avatar { width: 120px; height: 160px; }
    .intro h2 { font-size: 24px; }
    .intro p { font-size: 16px; }
    .dialog { flex-direction: column; }
    .avatar { width: 100px; height: 130px; margin: 0 auto; }
    .bubble { min-width: 100%; font-size: 16px; padding: 14px; }
    .option { font-size: 15px; padding: 12px; }
    .report-item { flex-direction: column; align-items: flex-start; }
    .report-item .val-block { text-align: left; margin-top: 4px; }
    .bio-age-number { font-size: 48px; }
    .bio-age-label { font-size: 15px; }
    .risk-scale-labels { font-size: 10px; }
    .row { flex-direction: column; }
    .row .field { min-width: 100%; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .app { box-shadow: none; max-width: 100%; }
    .header, .reset-btn, .theme-btn, .btn, .actions, .avatar { display: none !important; }
    .content { padding: 0; }
    .bubble { background: #fff; }
    .report-section { break-inside: avoid; }
    .bio-age-display { background: #2c5282 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .modified-banner { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span>Онлайн-консультация: оценка рисков здоровья</span>
    <div class="header-controls">
      <button class="theme-btn" id="themeBtn">🌙</button>
      <button class="reset-btn" id="resetBtn">Сбросить</button>
    </div>
  </div>
  <div class="content" id="content">
    <p style="text-align:center;color:var(--muted)">Загрузка...</p>
  </div>
</div>

<script>
(function() {
  'use strict';

  const TAPLINK_URL = 'https://pystogovas.taplink.ws/';

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }
  function playClick() {
    initAudio();
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = 800; osc.type = 'sine';
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }
  function playSuccess() {
    initAudio();
    if (!audioCtx) return;
    try {
      [523, 659, 784].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq; osc.type = 'sine';
        const t = audioCtx.currentTime + i * 0.08;
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
      });
    } catch(e) {}
  }

  const themeBtn = document.getElementById('themeBtn');
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark');
    themeBtn.textContent = '☀️';
  }
  themeBtn.addEventListener('click', function() {
    playClick();
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    themeBtn.textContent = isDark ? '☀️' : '🌙';
    try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(e) {}
  });

  const storage = {
    get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
    remove: function(k) { try { localStorage.removeItem(k); } catch(e) {} }
  };

  const patient = {
    name: '', sex: 'm', age: 0, pregnant: false,
    smoking: false, alcohol: 0,
    height: 0, weight: 0, waist: 0,
    activity: 0, vegetables: 0,
    hypertension: false, glucoseHistory: false,
    familyDiabetes: false, familyCancer: false,
    familyTEP: false, familyHipFracture: false,
    sbp: 0,
    glucose: null, hba1c: null,
    cholesterol: null, ldl: null, hdl: null, triglycerides: null,
    alt: null, ast: null, platelets: null,
    creatinine: null,
    hemoglobin: null, mcv: null, ferritin: null,
    tsh: null, leukocytes: null, hematocrit: null, crp: null,
    calcium: null, albumin: null, pth: null, magnesium: null,
    testosterone: null, gspg: null, psa: null,
    diabetesAge: null
  };

  const saved = storage.get('patientData');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data && typeof data === 'object') {
        Object.keys(data).forEach(function(k) {
          if (patient.hasOwnProperty(k)) patient[k] = data[k];
        });
      }
    } catch(e) {}
  }
  
  let originalPatientData = null;
  let dataModifiedViaWhatIf = false;
  
  function saveOriginalData() {
    originalPatientData = JSON.parse(JSON.stringify(patient));
  }
  function restoreOriginalData() {
    if (originalPatientData) {
      Object.keys(originalPatientData).forEach(function(k) {
        patient[k] = originalPatientData[k];
      });
      savePatient();
      dataModifiedViaWhatIf = false;
    }
  }
  
  function savePatient() { storage.set('patientData', JSON.stringify(patient)); }

  function getPct(level, isVeryHigh) {
    if (level === 'low') return 15;
    if (level === 'med') return 37;
    if (isVeryHigh) return 87;
    return 62;
  }

  function calcCorrectedCalcium(ca, alb) {
    if (ca === null || ca === undefined || alb === null || alb === undefined) return null;
    return ca + 0.02 * (40 - alb);
  }

  function calcFreeTestosterone(totalT, gspg) {
    if (totalT === null || totalT === undefined || gspg === null || gspg === undefined) return null;
    const freeT = (totalT / (1 + 0.036 * gspg)) * 1000;
    return freeT;
  }

  const refs = {
    glucose: function(v) {
      if (v === null || v === undefined || v === '') return null;
      if (v < 5.6) return { level: 'low', text: 'Норма', ref: 'норма: 4.1–5.6 ммоль/л', pct: getPct('low') };

  const calc = {
    bmi: function() {
      return (patient.weight && patient.height) ? patient.weight / Math.pow(patient.height/100, 2) : null;
    },
    whtr: function() {
      return (patient.waist && patient.height) ? patient.waist / patient.height : null;
    },
    whtrRisk: function() {
      const r = calc.whtr();
      if (r === null) return { level: 'med', text: 'Нет данных' };
      if (r < 0.5) return { level: 'low', text: 'Норма' };
      if (r < 0.6) return { level: 'med', text: 'Повышен' };
      return { level: 'high', text: 'Высокий' };
    },
    findrisk: function() {
      if (!patient.age || !patient.weight || !patient.height || !patient.waist) return null;
      let s = 0;
      if (patient.age < 45) s += 0;
      else if (patient.age < 55) s += 2;
      else if (patient.age < 65) s += 3;
      else s += 4;
      const bmi = calc.bmi();
      if (bmi < 25) s += 0; else if (bmi < 30) s += 1; else s += 3;
      if (patient.sex === 'm') {
        if (patient.waist < 94) s += 0; else if (patient.waist < 102) s += 3; else s += 4;
      } else {
        if (patient.waist < 80) s += 0; else if (patient.waist < 88) s += 3; else s += 4;
      }
      if (patient.activity < 1) s += 2;
      if (patient.vegetables < 1) s += 1;
      if (patient.hypertension) s += 2;
      if (patient.glucoseHistory) s += 5;
      if (patient.familyDiabetes) s += 3;
      return s;
    },
    findriskText: function() {
      const s = calc.findrisk();
      if (s === null) return { level: 'med', text: 'Недостаточно данных', pct: null };
      if (s < 7) return { level: 'low', text: 'Низкий (' + s + ' баллов) — ~1% на 10 лет', pct: getPct('low') };
      if (s < 15) return { level: 'med', text: 'Умеренный (' + s + ') — ~4-17% на 10 лет', pct: getPct('med') };
      if (s < 21) return { level: 'high', text: 'Высокий (' + s + ') — ~33% на 10 лет', pct: getPct('high') };
      return { level: 'high', text: 'Очень высокий (' + s + ') — ~50% на 10 лет', pct: getPct('high', true) };
    },
    fib4: function() {
      if (!patient.alt || !patient.ast || !patient.platelets || !patient.age) return null;
      return (patient.age * patient.ast) / (patient.platelets * Math.sqrt(patient.alt));
    },
    fib4Text: function() {
      const v = calc.fib4();
      if (v === null) return { level: 'med', text: 'Недостаточно данных', pct: null };
      if (v < 1.3) return { level: 'low', text: 'Низкий риск фиброза (' + v.toFixed(2) + ')', pct: getPct('low') };
      if (v < 2.67) return { level: 'med', text: 'Промежуточный (' + v.toFixed(2) + ') — нужно уточнение', pct: getPct('med') };
      return { level: 'high', text: 'Высокий (' + v.toFixed(2) + ') — вероятен фиброз', pct: getPct('high') };
    },
    egfr: function() {
      if (!patient.creatinine || !patient.age || !patient.sex) return null;
      const scr = patient.creatinine / 88.4;
      const kappa = patient.sex === 'f' ? 0.7 : 0.9;
      const alpha = patient.sex === 'f' ? -0.241 : -0.302;
      const min = Math.min(scr / kappa, 1);
      const max = Math.max(scr / kappa, 1);
      return 142 * Math.pow(min, alpha) * Math.pow(max, -1.200) * Math.pow(0.9938, patient.age) * (patient.sex === 'f' ? 1.012 : 1);
    },
    egfrText: function() {
      const v = calc.egfr();
      if (v === null) return { level: 'med', text: 'Нет данных по креатинину', pct: null };
      if (v >= 90) return { level: 'low', text: 'Норма (СКФ ' + Math.round(v) + ')', pct: getPct('low') };
      if (v >= 60) return { level: 'med', text: 'Незначительно снижена (СКФ ' + Math.round(v) + ')', pct: getPct('med') };
      if (v >= 45) return { level: 'high', text: 'Умеренно снижена (СКФ ' + Math.round(v) + ')', pct: getPct('high') };
      return { level: 'high', text: 'Значительно снижена (СКФ ' + Math.round(v) + ') — нужна консультация', pct: getPct('high', true) };
    },
    // ===== SCORE2 / SCORE2-OP (ESC 2021, регион "очень высокий риск" — РФ) =====
    score2: function() {
      if (patient.age < 40) return { level: 'warn', text: 'Шкала SCORE2 валидна с 40 лет', pct: null, tooYoung: true };
      if (patient.age > 89) return { level: 'warn', text: 'Шкала SCORE2 валидна до 89 лет', pct: null, tooOld: true };
      if (!patient.sbp || !patient.cholesterol || !patient.hdl || !patient.age || !patient.sex) 
        return { level: 'med', text: 'Недостаточно данных (нужны возраст, пол, курение, САД, общий ХС и ЛПВП)', pct: null };
      
      const nonHDL = patient.cholesterol - patient.hdl;
      const age = patient.age;
      const smoking = patient.smoking ? 1 : 0;
      const sbp = patient.sbp;
      
      let alpha, b1, b2, b3, b4, b5, b6, b7, St;
      
      if (age < 70) {
        // SCORE2 (40-69 лет)
        if (patient.sex === 'm') {
          alpha = -11.33; b1 = 0.074; b2 = 0.60; b3 = 0.23; b4 = 0.15;
          b5 = -0.009; b6 = -0.002; b7 = -0.002; St = 0.9333;
        } else {
          alpha = -13.17; b1 = 0.078; b2 = 0.66; b3 = 0.28; b4 = 0.17;
          b5 = -0.012; b6 = -0.003; b7 = -0.002; St = 0.9622;
        }
      } else {
        // SCORE2-OP (70-89 лет)
        if (patient.sex === 'm') {
          alpha = -8.44; b1 = 0.055; b2 = 0.43; b3 = 0.19; b4 = 0.12;
          b5 = -0.006; b6 = -0.001; b7 = -0.001; St = 0.8933;
        } else {
          alpha = -9.77; b1 = 0.060; b2 = 0.48; b3 = 0.23; b4 = 0.14;
          b5 = -0.008; b6 = -0.002; b7 = -0.001; St = 0.9346;
        }
      }
      
      const linearPredictor = alpha + b1*age + b2*smoking + b3*(sbp/10) + b4*nonHDL + b5*age*smoking + b6*age*(sbp/10) + b7*age*nonHDL;
      const risk = 1 - Math.pow(St, Math.exp(linearPredictor));
      const riskPct = Math.max(0, Math.min(100, risk * 100));
      
      // Пороги для РФ (очень высокий риск) по возрастным группам
      let level, txt, suffix = '';
      if (age < 50) {
        if (riskPct < 2.5) { level = 'low'; txt = 'Низкий'; }
        else if (riskPct < 7.5) { level = 'med'; txt = 'Умеренный'; }
        else { level = 'high'; txt = 'Высокий'; }
      } else if (age < 70) {
        if (riskPct < 5) { level = 'low'; txt = 'Низкий'; }
        else if (riskPct < 10) { level = 'med'; txt = 'Умеренный'; }
        else { level = 'high'; txt = 'Высокий'; }
      } else {
        suffix = ' [SCORE2-OP]';
        if (riskPct < 7.5) { level = 'low'; txt = 'Низкий'; }
        else if (riskPct < 15) { level = 'med'; txt = 'Умеренный'; }
        else { level = 'high'; txt = 'Высокий'; }
      }
      
      return { 
        level: level, 
        text: txt + ' (~' + riskPct.toFixed(1) + '% на 10 лет)' + suffix, 
        pct: getPct(level),
        riskPct: riskPct,
        isOP: age >= 70
      };

    // ===== SCORE2-Diabetes (ESC 2023, регион "очень высокий риск" — РФ) =====
    score2diabetes: function() {
      if (patient.age < 40) return { level: 'warn', text: 'Шкала SCORE2-Diabetes валидна с 40 лет', pct: null, tooYoung: true };
      if (patient.age > 69) return { level: 'warn', text: 'Шкала SCORE2-Diabetes валидна до 69 лет', pct: null, tooOld: true };
      if (!patient.hba1c || !patient.age || !patient.sbp || !patient.cholesterol || !patient.hdl) 
        return { level: 'med', text: 'Недостаточно данных (нужны возраст, пол, курение, САД, общий ХС, ЛПВП, HbA1c)', pct: null };
      
      const nonHDL = patient.cholesterol - patient.hdl;
      const age = patient.age;
      const smoking = patient.smoking ? 1 : 0;
      const sbp = patient.sbp;
      const hba1c_pct = patient.hba1c;
      const egfr = calc.egfr();
      const diabetesAge = patient.diabetesAge || age;
      
      let alpha, b1, b2, b3, b4, b5, b6, b7, St;
      
      if (patient.sex === 'm') {
        alpha = -9.62; b1 = 0.064; b2 = 0.46; b3 = 0.17; b4 = 0.12;
        b5 = 0.14; b6 = -0.08; b7 = -0.01; St = 0.9052;
      } else {
        alpha = -11.24; b1 = 0.068; b2 = 0.51; b3 = 0.21; b4 = 0.14;
        b5 = 0.16; b6 = -0.10; b7 = -0.01; St = 0.9447;
      }
      
      const egfrTerm = egfr ? (egfr/10) : 6;
      const linearPredictor = alpha + b1*age + b2*smoking + b3*(sbp/10) + b4*nonHDL + b5*hba1c_pct + b6*egfrTerm + b7*diabetesAge;
      const risk = 1 - Math.pow(St, Math.exp(linearPredictor));
      const riskPct = Math.max(0, Math.min(100, risk * 100));
      
      // Категории риска SCORE2-Diabetes (2023 ESC)
      let level, txt;
      if (riskPct < 5) { level = 'low'; txt = 'Низкий'; }
      else if (riskPct < 10) { level = 'med'; txt = 'Умеренный'; }
      else if (riskPct < 20) { level = 'high'; txt = 'Высокий'; }
      else { level = 'high'; txt = 'Очень высокий'; }
      
      return { 
        level: level, 
        text: txt + ' (~' + riskPct.toFixed(1) + '% на 10 лет)', 
        pct: getPct(level),
        riskPct: riskPct
      };
    },
    biologicalAge: function() {
      if (!patient.age) return null;
      let bio = patient.age;
      if (patient.smoking) bio += 4;
      const bmi = calc.bmi();
      if (bmi && bmi >= 30) bio += 5;
      else if (bmi && bmi >= 25) bio += 2;
      if (patient.sbp >= 140) bio += 3;
      else if (patient.sbp >= 130) bio += 1;
      if (patient.activity < 1) bio += 2;
      else if (patient.activity >= 3) bio -= 1;
      const whtr = calc.whtr();
      if (whtr && whtr >= 0.6) bio += 3;
      else if (whtr && whtr >= 0.5) bio += 1;
      if (patient.cholesterol && patient.cholesterol >= 6) bio += 2;
      if (patient.familyCancer) bio += 1;
      if (patient.alcohol > 7) bio += 1;
      if (patient.vegetables < 3) bio += 1;
      bio = Math.round(bio);
      bio = Math.max(18, Math.min(patient.age + 20, bio));
      return bio;
    }

          '<div class="row">' +
            '<div class="field"><label>АЛТ, Ед/л</label>' +
              '<input type="text" id="alt" value="' + (patient.alt||'') + '" placeholder="25">' +
              '<div class="hint">м: &lt;40, ж: &lt;32</div></div>' +
            '<div class="field"><label>АСТ, Ед/л</label>' +
              '<input type="text" id="ast" value="' + (patient.ast||'') + '" placeholder="22">' +

          '<div class="row">' +
            '<div class="field"><label>Возраст начала диабета, лет (если есть)</label>' +
              '<input type="text" id="diabetesAge" value="' + (patient.diabetesAge||'') + '" placeholder="55">' +
              '<div class="hint">для SCORE2-Diabetes; если нет диабета — оставьте пустым</div></div>' +
          '</div>'
      }
    ];
    const s = steps[step];
    content.innerHTML = 
      '<div class="fade-in">' +
        '<div class="progress"><div class="progress-bar" style="width:' + ((step+1)*25) + '%"></div></div>' +
        '<h2 style="margin-top:0">' + s.title + '</h2>' +
        s.html +
        '<div class="actions">' +
          (step > 0 ? '<button class="btn secondary" id="prevBtn">Назад</button>' : '') +
          '<button class="btn" id="nextBtn">' + (step < 3 ? 'Далее' : 'Сохранить и продолжить') + '</button>' +
        '</div>' +
      '</div>';
    if (step > 0) {
      document.getElementById('prevBtn').addEventListener('click', function() {
        playClick();
        saveStep(currentStep);
        currentStep = step - 1;
        renderForm(currentStep);
      });
    }
    document.getElementById('nextBtn').addEventListener('click', function() {
      playClick();
      saveStep(currentStep);
      if (step < 3) {
        currentStep = step + 1;
        renderForm(currentStep);
      } else {
        playSuccess();
        startDialog();
      }
    });
  }

  function saveStep(step) {
    const v = function(id) { const el = document.getElementById(id); return el ? el.value : ''; };
    if (step === 0) {
      patient.name = v('name').trim();
      patient.sex = v('sex');
      patient.age = parseInt(v('age')) || 0;
      patient.pregnant = v('pregnant') === '1';
      patient.smoking = v('smoking') === '1';
      patient.alcohol = parseFloat(v('alcohol').replace(',', '.')) || 0;
    } else if (step === 1) {
      patient.height = parseFloat(v('height').replace(',', '.')) || 0;
      patient.weight = parseFloat(v('weight').replace(',', '.')) || 0;
      patient.waist = parseFloat(v('waist').replace(',', '.')) || 0;
      patient.sbp = parseFloat(v('sbp').replace(',', '.')) || 0;
      patient.activity = parseFloat(v('activity').replace(',', '.')) || 0;
      patient.vegetables = parseFloat(v('vegetables').replace(',', '.')) || 0;
      patient.hypertension = v('hypertension') === '1';
      patient.glucoseHistory = v('glucoseHistory') === '1';
    } else if (step === 2) {
      patient.familyDiabetes = v('familyDiabetes') === '1';
      patient.familyCancer = v('familyCancer') === '1';
      patient.familyTEP = v('familyTEP') === '1';
      patient.familyHipFracture = v('familyHipFracture') === '1';
    } else if (step === 3) {
      ['glucose','hba1c','cholesterol','ldl','hdl','triglycerides','creatinine','alt','ast','platelets','hemoglobin','hematocrit','mcv','ferritin','crp','tsh','leukocytes','calcium','albumin','pth','magnesium','testosterone','gspg','psa','diabetesAge'].forEach(function(k) {
        const val = v(k);
        patient[k] = val ? parseFloat(val.replace(',', '.')) : null;
      });
    }
    savePatient();
  }

    let optionsHtml = '<div class="options stagger">';
    options.forEach(function(o) {
      const cls = o.taplink ? 'option taplink-opt' : 'option';
      optionsHtml += '<button class="' + cls + '" data-next="' + o.next + '">' + o.label + '</button>';
    });
    optionsHtml += '</div>';
    content.innerHTML = 
      '<div class="dialog fade-in">' +
        '<div class="avatar">' +

      '</div>';
    const optionBtns = content.querySelectorAll('.option[data-next]');

    const mouth = document.getElementById('mouth');

  function goNode(n) { currentNode = n; renderDialog(); }
  function startDialog() { currentNode = 'start'; renderDialog(); }

          '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Зелёный — норма, оранжевый — умеренное отклонение, красный — высокий уровень</div>' +
          refHtml +
          '<div class="info-hint" style="margin-top:16px"><strong>Важно:</strong> референсные значения указаны ориентировочно и могут отличаться в зависимости от лаборатории и используемых методов анализа. Всегда ориентируйтесь на референсы той лаборатории, где сдавали анализ.</div>' +
          '<div class="info-hint"><strong>Про ферритин:</strong> это острофазовый белок. При воспалении, инфекции или болезнях печени он может быть ложно повышен даже при истинном дефиците железа. Для правильной интерпретации ориентируйтесь на С-реактивный белок (СРБ): если СРБ повышен, ферритин может быть ложно завышен. В таких случаях дополнительно оценивают НТЖ — насыщение трансферрина железом.</div>' +
          '<div class="info-hint"><strong>Про магний:</strong> в крови содержится менее 1% всего магния в организме. Анализ крови на магний неточен для оценки общего дефицита. При симптомах дефицита (судороги, усталость, нарушения сна) рассмотрите консультацию врача.</div>' +
        '</div>' +

        '<div class="report-section">' +
          '<h3>Топ-рекомендации</h3>' +
          tips.slice(0, 3).map(function(t, i) {
            return '<div class="report-item"><span><strong>' + (i+1) + '. ' + t.t + '</strong><br><span style="font-size:13px;color:var(--muted)">' + t.d + '</span></span></div>';
          }).join('') +
        '</div>' +

        '<div class="report-section">' +
          '<h3>Анализы</h3>' +
          '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">✓ — введены в анкете, нужно дополнить остальное</div>' +
          tests.filter(function(t) { return !t.maleOnly || patient.sex === 'm'; }).map(function(t) {
            return '<div class="report-item"><span>' + t.n + '</span><span class="test-status' + (t.d ? ' done' : '') + '">' + (t.d ? '✓ введён' : 'рекомендуется') + '</span></div>';
          }).join('') +
        '</div>' +

        '<div class="report-section" style="background:var(--risk-med);border-left:4px solid var(--risk-med-t)">' +
          '<strong>Важно:</strong> этот отчёт носит информационный характер и не заменяет очного приема врача. Покажите его своему доктору для обсуждения тактики.' +
        '</div>' +

        '<div class="actions stagger">' +
          '<a class="btn taplink" href="' + TAPLINK_URL + '" target="_blank">📅 Записаться на приём</a>' +
          '<button class="btn accent" id="printBtn">🖨 Распечатать / PDF</button>' +
          '<button class="btn" id="whatIfBtn">Что если... (сценарии)</button>' +
          '<button class="btn secondary" id="labBtn">Чек-лист для лаборатории</button>' +
          (dataModifiedViaWhatIf ? '<button class="btn warning" id="restoreBtn">↩ Вернуться к исходным данным</button>' : '') +
          '<button class="btn secondary" id="backBtn">← К диалогу</button>' +
        '</div>' +
      '</div>';

    document.getElementById('printBtn').addEventListener('click', function() { playClick(); window.print(); });
    document.getElementById('whatIfBtn').addEventListener('click', function() { playClick(); renderWhatIf(); });
    document.getElementById('labBtn').addEventListener('click', function() { playClick(); renderLabChecklist(); });
    const restoreBtn = document.getElementById('restoreBtn');
    if (restoreBtn) {
      restoreBtn.addEventListener('click', function() {
        playClick();
        restoreOriginalData();
        renderReport();
      });
    }
    document.getElementById('backBtn').addEventListener('click', function() { playClick(); currentNode = 'start'; renderDialog(); });
  }

  function renderWhatIf() {
    if (!dataModifiedViaWhatIf) {
      saveOriginalData();
    }
    
    const wi = {
      weight: patient.weight || 80,
      sbp: patient.sbp || 120,
      activity: patient.activity || 0,
      smoking: patient.smoking,
      waist: patient.waist || 90
    };

    function recalc() {
      const origW = patient.weight, origSbp = patient.sbp, origA = patient.activity, origSm = patient.smoking, origWaist = patient.waist;
      patient.weight = wi.weight; patient.sbp = wi.sbp; patient.activity = wi.activity; patient.smoking = wi.smoking; patient.waist = wi.waist;
      
      const s2 = calc.score2();
      const fr = calc.findriskText();
      const s2d = calc.score2diabetes();
      const bio = calc.biologicalAge();
      const bmi = calc.bmi();
      const whtr = calc.whtr();
      
      patient.weight = origW; patient.sbp = origSbp; patient.activity = origA; patient.smoking = origSm; patient.waist = origWaist;

      document.getElementById('wi-s2').innerHTML = s2 ? (s2.tooYoung || s2.tooOld ? '<span class="risk warn">' + s2.text + '</span>' : '<span class="risk ' + s2.level + '">' + s2.text + '</span>') : '<span style="color:var(--muted)">нет данных</span>';
      document.getElementById('wi-fr').innerHTML = fr.pct !== null ? '<span class="risk ' + fr.level + '">' + fr.text + '</span>' : '<span style="color:var(--muted)">нет данных</span>';
      document.getElementById('wi-s2d').innerHTML = s2d ? (s2d.tooYoung || s2d.tooOld ? '<span class="risk warn">' + s2d.text + '</span>' : '<span class="risk ' + s2d.level + '">' + s2d.text + '</span>') : '<span style="color:var(--muted)">нет данных</span>';
      document.getElementById('wi-bio').textContent = bio ? bio + ' лет' : '—';
      document.getElementById('wi-bmi').textContent = bmi ? bmi.toFixed(1) : '—';
      document.getElementById('wi-whtr').textContent = whtr ? whtr.toFixed(2) : '—';
      document.getElementById('wi-act-val').textContent = wi.activity + ' ч/нед';
      document.getElementById('wi-weight-val').textContent = wi.weight + ' кг';
      document.getElementById('wi-sbp-val').textContent = wi.sbp + ' мм рт.ст.';
      document.getElementById('wi-waist-val').textContent = wi.waist + ' см';
    }

    content.innerHTML = 
      '<div class="fade-in">' +
        '<h2 style="margin-top:0;color:var(--btn)">Сценарий «Что если...»</h2>' +
        '<p style="color:var(--muted)">Изменяйте параметры — риски пересчитываются мгновенно. Изменения не сохраняются, пока вы не нажмёте «Применить».</p>' +
        
        '<div class="report-section">' +
          '<h3>Ваши параметры</h3>' +
          '<div class="whatif-slider"><label>Вес <span class="value" id="wi-weight-val">' + wi.weight + ' кг</span></label><input type="range" id="wi-weight" min="50" max="150" value="' + wi.weight + '"></div>' +
          '<div class="whatif-slider"><label>Талия <span class="value" id="wi-waist-val">' + wi.waist + ' см</span></label><input type="range" id="wi-waist" min="60" max="140" value="' + wi.waist + '"></div>' +
          '<div class="whatif-slider"><label>Давление (систолическое) <span class="value" id="wi-sbp-val">' + wi.sbp + ' мм рт.ст.</span></label><input type="range" id="wi-sbp" min="90" max="200" value="' + wi.sbp + '"></div>' +
          '<div class="whatif-slider"><label>Активность <span class="value" id="wi-act-val">' + wi.activity + ' ч/нед</span></label><input type="range" id="wi-activity" min="0" max="10" step="0.5" value="' + wi.activity + '"></div>' +
          '<label class="whatif-toggle"><input type="checkbox" id="wi-smoking"' + (wi.smoking ? ' checked' : '') + '> Курю</label>' +
        '</div>' +

        '<div class="report-section">' +
          '<h3>Как меняются риски</h3>' +
          '<div class="report-item"><span>ССЗ за 10 лет (SCORE2)</span><span id="wi-s2">—</span></div>' +
          '<div class="report-item"><span>Диабет (FINDRISK)</span><span id="wi-fr">—</span></div>' +
          '<div class="report-item"><span>ССЗ при диабете (SCORE2-Diabetes)</span><span id="wi-s2d">—</span></div>' +
          '<div class="report-item"><span>ИМТ</span><span id="wi-bmi">—</span></div>' +
          '<div class="report-item"><span>Талия/рост</span><span id="wi-whtr">—</span></div>' +
          '<div class="report-item"><span>Биологический возраст</span><span id="wi-bio">—</span></div>' +
        '</div>' +

        '<div class="good-news">' +
          '<strong>Хорошая новость:</strong> вы видите, как риски меняются прямо сейчас. Это значит, что они управляемы. Даже небольшие изменения (минус 3-5 кг, плюс 1 час ходьбы в неделю) дают измеримый эффект.' +
        '</div>' +

        '<div class="actions stagger">' +
          '<button class="btn accent" id="wi-apply">Применить изменения</button>' +
          '<button class="btn secondary" id="wi-reset">Сбросить к исходным</button>' +
          '<button class="btn secondary" id="wi-back">← К отчёту</button>' +
        '</div>' +
      '</div>';

    ['weight','waist','sbp','activity'].forEach(function(k) {
      document.getElementById('wi-' + k).addEventListener('input', function(e) {
        wi[k] = parseFloat(e.target.value);
        recalc();
      });
    });
    document.getElementById('wi-smoking').addEventListener('change', function(e) {
      wi.smoking = e.target.checked;
      recalc();
    });

    document.getElementById('wi-apply').addEventListener('click', function() {
      playSuccess();
      patient.weight = wi.weight; patient.waist = wi.waist; patient.sbp = wi.sbp; patient.activity = wi.activity; patient.smoking = wi.smoking;
      savePatient();
      dataModifiedViaWhatIf = true;
      renderReport();
    });
    document.getElementById('wi-reset').addEventListener('click', function() {
      playClick();
      wi.weight = patient.weight || 80; wi.waist = patient.waist || 90; wi.sbp = patient.sbp || 120; wi.activity = patient.activity || 0; wi.smoking = patient.smoking;
      document.getElementById('wi-weight').value = wi.weight;
      document.getElementById('wi-waist').value = wi.waist;
      document.getElementById('wi-sbp').value = wi.sbp;
      document.getElementById('wi-activity').value = wi.activity;
      document.getElementById('wi-smoking').checked = wi.smoking;
      recalc();
    });
    document.getElementById('wi-back').addEventListener('click', function() { playClick(); renderReport(); });

    recalc();
  }

  function renderLabChecklist() {
    const tests = [
      {n: 'Общий анализ крови (ОАК)', r: 'Базовый скрининг: гемоглобин, гематокрит, MCV, лейкоциты, тромбоциты', d: patient.hemoglobin !== null || patient.leukocytes !== null || patient.platelets !== null},
      {n: 'Глюкоза натощак', r: 'Скрининг диабета', d: patient.glucose !== null},
      {n: 'HbA1c (гликированный гемоглобин)', r: 'Средний сахар за 3 месяца', d: patient.hba1c !== null},
      {n: 'Глюкозотолерантный тест', r: 'При пограничных значениях глюкозы', d: false},
      {n: 'Общий холестерин', r: 'Оценка сердечно-сосудистого риска; для SCORE2', d: patient.cholesterol !== null},
      {n: 'ЛПНП', r: '«Плохой» холестерин — главный враг сосудов', d: patient.ldl !== null},
      {n: 'ЛПВП', r: '«Хороший» холестерин (оптимум 1.0–2.3); для SCORE2', d: patient.hdl !== null},
      {n: 'Триглицериды', r: 'Маркер метаболического риска', d: patient.triglycerides !== null},
      {n: 'Креатинин + расчёт СКФ', r: 'Функция почек', d: patient.creatinine !== null},
      {n: 'Мочевина', r: 'Дополнительно к креатинину', d: false},
      {n: 'Мочевая кислота', r: 'Обмен веществ, риск подагры', d: false},
      {n: 'АЛТ', r: 'Функция печени', d: patient.alt !== null},
      {n: 'АСТ', r: 'Функция печени, для FIB-4', d: patient.ast !== null},
      {n: 'Тромбоциты', r: 'Для расчёта FIB-4', d: patient.platelets !== null},
      {n: 'Общий белок', r: 'Общее состояние, питание', d: false},
      {n: 'ТТГ', r: 'Скрининг щитовидной железы', d: patient.tsh !== null},
      {n: 'Витамин D (25-OH)', r: 'Частый дефицит в России', d: false},
      {n: 'Ферритин', r: 'Запасы железа; дефицит <30 нг/мл (ASH/EHA)', d: patient.ferritin !== null},
      {n: 'С-реактивный белок (СРБ)', r: 'Оценка воспаления; для интерпретации ферритина', d: patient.crp !== null},
      {n: 'Кальций общий + альбумин', r: 'Для расчёта скорректированного кальция', d: patient.calcium !== null || patient.albumin !== null},
      {n: 'Паратгормон (ПТГ)', r: 'Обмен кальция и фосфора', d: patient.pth !== null},
      {n: 'Магний', r: 'Важный микроэлемент; в крови <1% всего Mg', d: patient.magnesium !== null},
      {n: 'Тестостерон общий + ГСПГ', r: 'Для мужчин: расчёт свободного тестостерона (норма ≥243 пмоль/л)', d: patient.testosterone !== null || patient.gspg !== null, maleOnly: true},
      {n: 'ПСА', r: 'Скрининг рака простаты (мужчины 45+)', d: patient.psa !== null, maleOnly: true},
      {n: 'Витамин B12', r: 'При макроцитарной анемии', d: false},
      {n: 'Фолаты (B9)', r: 'При макроцитарной анемии', d: false},
      {n: 'Коагулограмма', r: 'При семейной ТЭЛА', d: false},
      {n: 'Денситометрия', r: 'При семейных переломах шейки бедра', d: false}
    ];

    const savedChecks = storage.get('labChecks');
    let checks = {};
    if (savedChecks) { try { checks = JSON.parse(savedChecks); } catch(e) {} }

    content.innerHTML = 
      '<div class="fade-in">' +
        '<h2 style="margin-top:0;color:var(--btn)">Чек-лист для лаборатории</h2>' +
        '<p style="color:var(--muted)">Отметьте, что уже сдавали. Список можно скопировать и показать в лаборатории.</p>' +
        '<div id="checklist">' +
          tests.filter(function(t) { return !t.maleOnly || patient.sex === 'm'; }).map(function(t) {
            const checked = checks[t.n] ? ' checked' : '';
            const doneClass = checks[t.n] ? ' done' : '';
            return '<div class="checklist-item' + doneClass + '">' +
              '<input type="checkbox" data-test="' + t.n + '"' + checked + '>' +
              '<div style="flex:1"><div class="test-name">' + t.n + '</div><div class="test-reason">' + t.r + '</div></div>' +
              '<span class="test-status' + (t.d ? ' done' : '') + '">' + (t.d ? 'введено' : 'рекомендуется') + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="actions stagger">' +
          '<button class="btn accent" id="copyBtn">📋 Скопировать список</button>' +
          '<button class="btn secondary" id="labBack">← К отчёту</button>' +
        '</div>' +
      '</div>';

    const checkboxes = content.querySelectorAll('#checklist input[type="checkbox"]');
    checkboxes.forEach(function(cb) {
      cb.addEventListener('change', function() {
        playClick();
        checks[cb.getAttribute('data-test')] = cb.checked;
        cb.parentElement.classList.toggle('done', cb.checked);
        try { storage.set('labChecks', JSON.stringify(checks)); } catch(e) {}
      });
    });

    document.getElementById('copyBtn').addEventListener('click', function() {
      playSuccess();
      const list = tests.filter(function(t) { return !t.maleOnly || patient.sex === 'm'; }).map(function(t, i) {
        const mark = checks[t.n] ? '✓' : '○';
        return (i+1) + '. ' + mark + ' ' + t.n + ' — ' + t.r;
      }).join('\n');
      const full = 'Чек-лист анализов для ' + patient.name + ':\n\n' + list + '\n\nДата: ' + new Date().toLocaleDateString('ru-RU');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(full).then(function() {
          document.getElementById('copyBtn').textContent = '✓ Скопировано!';
          setTimeout(function() { document.getElementById('copyBtn').textContent = '📋 Скопировать список'; }, 2000);
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = full;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        document.getElementById('copyBtn').textContent = '✓ Скопировано!';
      }
    });
    document.getElementById('labBack').addEventListener('click', function() { playClick(); renderReport(); });
  }

  function resetAll() {
    if (confirm('Вы уверены? Все данные будут удалены.')) {
      storage.remove('patientData');
      storage.remove('labChecks');
      location.reload();
    }
  }

  window.app = {
    goToStep: function(step) { playClick(); currentStep = step; renderForm(currentStep); }
  };

  document.getElementById('resetBtn').addEventListener('click', function() { playClick(); resetAll(); });

  renderIntro();

})();
</script>
</body>
</html>
